<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16100d" />
  <title>छठ घाट — Bihari nostalgia radio</title>
  <meta name="description" content="Purane Bihari gaane jo seedha ghar pahuncha dein. 99 authentic Chhath Puja classics with ad-free playback." />
  
  <!-- OpenGraph / Twitter Cards -->
  <meta property="og:title" content="छठ घाट — Bihari nostalgia radio" />
  <meta property="og:description" content="Purane Bihari gaane jo seedha ghar pahuncha dein." />
  <meta property="og:url" content="https://www.apnabihar.xyz" />
  <meta property="og:site_name" content="छठ घाट" />
  <meta property="og:locale" content="hi_IN" />
  <meta property="og:image" content="opengraph-image.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="छठ घाट — Bihari nostalgia radio" />
  <meta name="twitter:description" content="Purane Bihari gaane jo seedha ghar pahuncha dein." />
  <meta name="twitter:image" content="opengraph-image.jpg" />

  <link rel="icon" href="favicon.ico" type="image/x-icon" />

  <!-- Google Fonts: Baloo 2 for authentic Devanagari typography & Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background scene with authentic ghat image & sunset atmosphere -->
  <div class="scene" aria-hidden="true"></div>
  <div class="scene-glow" aria-hidden="true"></div>
  <div class="diyas-container" aria-hidden="true" id="diyasContainer"></div>

  <!-- Hidden YouTube Player Host (Ad-Free Privacy Embed) -->
  <div class="yt-host" aria-hidden="true">
    <div id="ytPlayer"></div>
  </div>

  <!-- Background Audio Session Keeper (Prevents audio pausing on screen off / phone lock) -->
  <audio id="bgAudioKeeper" src="silence.wav" preload="auto" loop playsinline></audio>

  <!-- Top Navigation Header (Spacious, Clean & Uncluttered) -->
  <header class="top-nav">
    <!-- Brand logo top left -->
    <div class="brand">
      <span class="brand__name">Apna Bihar</span>
    </div>

    <!-- Genuine Real-Time Live Listeners -->
    <div class="online" title="वास्तविक लाइव श्रोता">
      <span class="online__dot" aria-hidden="true"></span>
      <span id="onlineCount">1</span> लाइव श्रोता
    </div>

    <!-- Links top right -->
    <nav class="links">
      <a href="https://music.youtube.com/playlist?list=PLAN1r6kMkgwE" target="_blank" rel="noreferrer" title="YouTube Music Playlist">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M10 8.2 16 12l-6 3.8Z" fill="currentColor"></path>
        </svg>
        <span>YT Music</span>
      </a>
    </nav>
  </header>

  <!-- Big Central Title with generous breathing room -->
  <h1 class="title">छठ घाट</h1>

  <!-- ======================================================================
       MAIN FLOATING PLAYER PILL (STABLE, CRISP, NEVER DEFORMED)
       ====================================================================== -->
  <div class="pill" id="mainPill">
    
    <!-- Spinning Vinyl CD Artwork -->
    <div class="pill__art" id="pillArt" title="Play / Pause">
      <img id="pillArtImg" src="covers/qUeuWi81PmM.jpg" alt="" draggable="false" />
    </div>

    <!-- Song Meta (Clicking anywhere here opens the playlist sheet!) -->
    <div class="pill__meta" id="pillMetaToggle" title="गीत सूची देखने के लिए क्लिक करें">
      <div class="pill__title_row">
        <p class="pill__title" id="pillTitle">लोड हो रहल बा...</p>
        <div class="mini-equalizer" id="miniEqualizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="pill__artist_row">
        <p class="pill__artist" id="pillArtist">...</p>
        <span class="pill__list_hint">गीत सूची (99) ▴</span>
      </div>
      <button type="button" class="pill__seek" id="pillSeek" aria-label="गाना आगे-पीछे करीं">
        <span class="pill__rail">
          <span class="pill__fill" id="pillFill" style="width: 0%;"></span>
        </span>
      </button>
      <p class="pill__time" id="pillTime">0:00 / 0:00</p>
    </div>

    <!-- Controls -->
    <div class="pill__controls">
      <button type="button" class="skip" id="prevBtn" aria-label="पिछला गाना" title="पिछला गाना (Left Arrow)">
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 5.5h2.4v13H6Zm13 0v13L9.4 12Z" fill="currentColor"></path>
        </svg>
      </button>
      <button type="button" class="play" id="playBtn" aria-label="बजाईं" title="Play / Pause (Spacebar)">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5.2 19 12 8 18.8Z" fill="currentColor"></path>
        </svg>
      </button>
      <button type="button" class="skip" id="nextBtn" aria-label="अगला गाना" title="अगला गाना (Right Arrow)">
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 5.5h-2.4v13H18ZM5 5.5v13L14.6 12Z" fill="currentColor"></path>
        </svg>
      </button>
      <!-- Playlist toggle button on player -->
      <button type="button" class="playlist-toggle-btn" id="playlistToggleBtn" aria-label="गीत सूची खोलें" title="गीत सूची (99)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span class="queue-badge" id="queueBadge">99</span>
      </button>
    </div>
  </div>

  <!-- ======================================================================
       ELEGANT SLIDE-UP PLAYLIST SHEET (ZERO SHRINKING, 100% SMOOTH)
       ====================================================================== -->
  <div class="playlist-sheet" id="playlistSheet" role="dialog" aria-modal="true" aria-label="छठ गीत सूची">
    <div class="playlist-sheet-backdrop" id="sheetBackdrop"></div>
    <div class="playlist-sheet-content">
      
      <!-- Drag handle indicator on mobile -->
      <div class="sheet-drag-handle" id="sheetDragHandle"></div>

      <!-- Sheet Top Header -->
      <div class="sheet-header">
        <div class="sheet-title-area">
          <h2 class="sheet-title">
            <span class="sheet-title-icon">🎶</span> छठ गीत सूची
          </h2>
          <span class="sheet-subtitle" id="expandedCountBadge">99 छठ गीत</span>
        </div>
        <div class="sheet-header-actions">
          <button type="button" class="header-action-btn" id="ambientSoundBtn" title="घाट की पवित्र घंटी ध्वनि">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span id="ambientSoundText">घाट ध्वनि</span>
          </button>
          <button type="button" class="header-action-btn" id="shuffleToggleBtn" title="शफल मोड">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"></path>
            </svg>
            <span id="shuffleStatusText">शफल</span>
          </button>
          <button type="button" class="close-sheet-btn" id="closeExpandedBtn" aria-label="सूची बंद करें" title="बंद करें">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search Box & Filter Chips -->
      <div class="sheet-toolbar">
        <div class="sheet-search-box">
          <svg class="sheet-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="sheet-search-input" id="songSearchInput" placeholder="गाना या गायक खोजें (उदा. शारदा सिन्हा, पवन सिंह)..." autocomplete="off" />
          <button type="button" class="sheet-search-clear" id="searchClearBtn" aria-label="खोज साफ़ करें">&times;</button>
        </div>

        <!-- Singer Filter Chips -->
        <div class="sheet-chips" id="singerChips">
          <button type="button" class="chip-btn active" data-filter="all">सभी गीत (99)</button>
          <button type="button" class="chip-btn" data-filter="Sharda Sinha">🌺 शारदा सिन्हा</button>
          <button type="button" class="chip-btn" data-filter="Anuradha Paudwal">🌸 अनुराधा पौडवाल</button>
          <button type="button" class="chip-btn" data-filter="Pawan Singh">⚡ पवन सिंह</button>
          <button type="button" class="chip-btn" data-filter="Devi">🪷 देवी</button>
          <button type="button" class="chip-btn" data-filter="Kalpana Patowary">✨ कल्पना पटवारी</button>
          <button type="button" class="chip-btn" data-filter="Khesari Lal">खेसारी लाल</button>
          <button type="button" class="chip-btn" data-filter="favs">❤️ पसंदीदा</button>
        </div>
      </div>

      <!-- Scrollable List of Songs -->
      <div class="sheet-song-list" id="expandedSongList">
        <!-- Rendered dynamically by app.js -->
      </div>
    </div>
  </div>

  <!-- Bottom Left: Made by Rohan Credit -->
  <p class="credit">
    Made with ❤️ by <a href="#rohan" id="rohanCredit">Rohan</a>
  </p>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="songs.js"></script>
  <script src="app.js"></script>
</body>
</html>
